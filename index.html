<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walking the Menu</title>
  <style>
    :root {
      --bg: #fffcf9;
      --ink: #1e293b;
      --muted: #64748b;
      --blue: #4e89bd;
      --red: #e06c75;
      --green: #3f8f5a;
      --gold: #d79b2b;
      --line: #e2dcd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    h1 { margin: 24px 24px 0; font-size: 1.6rem; text-align: center; }

    .stage {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 24px;
      align-items: center;
    }

    /* Code panel with a highlighted line */
    .code {
      border: 3px solid var(--blue);
      border-radius: 14px;
      background: white;
      padding: 14px 0;
      font-family: Consolas, monospace;
      font-size: 1.08rem;
    }

    .line {
      padding: 3px 18px;
      white-space: pre;
      border-left: 6px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }

    .line.on { background: #fff1cc; border-left-color: var(--gold); }
    .line.bug { background: #fbe1e3; border-left-color: var(--red); }

    /* The menu and the counter */
    .right { display: flex; flex-direction: column; gap: 18px; }

    .menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

    .item {
      position: relative;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: white;
      padding: 10px 6px 8px;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s, opacity 0.3s;
    }

    .item .idx { color: var(--muted); font-family: Consolas, monospace; font-size: 0.9rem; }
    .item .emoji { font-size: 2rem; }
    .item .name { font-weight: 700; }
    .item .price { font-family: Consolas, monospace; }
    .item.done { opacity: 0.45; }
    .item.current { border-color: var(--gold); box-shadow: 0 0 0 6px #fde9b8; opacity: 1; }

    .pointer {
      height: 2.2em;
      position: relative;
    }

    .pointer span {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-family: Consolas, monospace;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--gold);
      transition: left 0.5s ease-in-out, color 0.3s;
      white-space: nowrap;
    }

    .pointer span.stop { color: var(--red); }

    .boxes { display: flex; gap: 14px; flex-wrap: wrap; }

    .box {
      flex: 1;
      min-width: 140px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: white;
      padding: 10px 14px;
      text-align: center;
    }

    .box .k { color: var(--muted); font-weight: 700; }
    .box .v { font-family: Consolas, monospace; font-size: 1.9rem; font-weight: 700; transition: color 0.3s; }
    .box .math { color: var(--muted); font-family: Consolas, monospace; min-height: 1.4em; }
    .box.pop .v { color: var(--green); }
    .box.bug .v { color: var(--red); }

    .caption {
      max-width: 900px;
      margin: 0 auto 8px;
      padding: 0 24px;
      min-height: 4.5em;
      font-size: 1.5rem;
      text-align: center;
    }

    code { font-family: Consolas, monospace; background: #f1ede7; padding: 1px 6px; border-radius: 4px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 24px 24px; }

    .controls button {
      padding: 10px 24px;
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }

    .controls #next { background: var(--ink); color: white; }
    .controls button:disabled { opacity: 0.35; cursor: default; }
    .count { color: var(--muted); }

    @media (max-width: 820px) {
      .stage { grid-template-columns: 1fr; }
      .code { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <h1>A loop walks the menu</h1>

  <div class="stage">
    <div class="code" id="code"></div>

    <div class="right">
      <div class="menu" id="menu"></div>
      <div class="pointer"><span id="pointer"></span></div>
      <div class="boxes">
        <div class="box" id="box-i"><div class="k">i</div><div class="v" id="v-i">–</div><div class="math" id="m-i"></div></div>
        <div class="box" id="box-total"><div class="k">total</div><div class="v" id="v-total">–</div><div class="math" id="m-total"></div></div>
      </div>
    </div>
  </div>

  <p class="caption" id="caption"></p>

  <div class="controls">
    <button id="back" type="button">← Back</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">Next →</button>
  </div>

  <script>
    const menu = [
      { emoji: "🌮", name: "Taco", price: 4.5 },
      { emoji: "🌯", name: "Burrito", price: 9 },
      { emoji: "🧀", name: "Nachos", price: 6.25 },
      { emoji: "🍩", name: "Churro", price: 3 }
    ];

    const forCode = [
      "let total = 0;",
      "",
      "for (let i = 0; i < menu.length; i++) {",
      "  total = total + menu[i].price;",
      "}",
      "",
      "console.log(total);"
    ];
    const bugCode = [
      "",
      "",
      "for (let i = 0; i < menu.length; i++) {",
      "  let total = 0;",
      "  total = total + menu[i].price;",
      "}",
      ""
    ];
    const eachCode = [
      "menu.forEach(function (item) {",
      "  console.log(item.name);",
      "});",
      "",
      "",
      "",
      ""
    ];

    // Each step: caption, code + highlighted line, the current item, and the boxes.
    const steps = [
      { text: "A <strong>loop</strong> runs the same code once for every item. Here's the menu, and a loop that adds up the prices.",
        code: forCode },
      { text: "<strong>Before</strong> the loop: <code>let total = 0;</code>. The total starts empty.",
        code: forCode, line: 0, total: "0" },
      { text: "<code>i</code> starts at <strong>0</strong>. Is 0 less than 4 (the length)? Yes, so go inside.",
        code: forCode, line: 2, at: 0, i: "0", iMath: "0 < 4 ✔", total: "0" },
      { text: "Add <code>menu[0].price</code> to the total.",
        code: forCode, line: 3, at: 0, i: "0", total: "4.5", tMath: "0 + 4.5", pop: true },
      { text: "<code>i++</code> adds 1. Now <code>i</code> is 1, so we're on the Burrito.",
        code: forCode, line: 3, at: 1, i: "1", iMath: "1 < 4 ✔", total: "13.5", tMath: "4.5 + 9", pop: true },
      { text: "<code>i</code> is 2: Nachos.",
        code: forCode, line: 3, at: 2, i: "2", iMath: "2 < 4 ✔", total: "19.75", tMath: "13.5 + 6.25", pop: true },
      { text: "<code>i</code> is 3: Churro. That's the <strong>last</strong> item: index 3, not 4.",
        code: forCode, line: 3, at: 3, i: "3", iMath: "3 < 4 ✔", total: "22.75", tMath: "19.75 + 3", pop: true },
      { text: "<code>i</code> is 4. Is 4 less than 4? <strong>No</strong>, so the loop stops. There's no <code>menu[4]</code>. That's why it's <code>&lt;</code>, not <code>&lt;=</code>.",
        code: forCode, line: 2, at: 4, i: "4", iMath: "4 < 4 ✖", total: "22.75", stop: true },
      { text: "After the loop, the total is ready: <strong>22.75</strong>.",
        code: forCode, line: 6, total: "22.75", pop: true },
      { text: "<strong>Bug hunt:</strong> what if <code>let total = 0;</code> goes <em>inside</em> the loop? Predict the answer in the chat.",
        code: bugCode, line: 3, bug: true },
      { text: "Every time round, <code>total</code> starts again at 0. You only get the <strong>last</strong> price: 3. Keep <code>let total = 0;</code> <strong>above</strong> the loop.",
        code: bugCode, line: 3, bug: true, at: 3, i: "3", total: "3", tMath: "0 + 3", bugBox: true },
      { text: "<code>forEach</code> walks the same list, but <strong>hands you each item</strong>. No <code>i</code> to count, and no <code>&lt;</code> to get wrong.",
        code: eachCode, line: 1, at: 0 },
      { text: "Same walk: Taco, Burrito, Nachos, Churro. Use a <code>for</code> loop to <strong>add up</strong>, and <code>forEach</code> to <strong>do something</strong> with each one.",
        code: eachCode, line: 1, at: 3, allDone: true }
    ];

    function el(id) { return document.getElementById(id); }

    // Build the menu cards once.
    menu.forEach(function (item, n) {
      const card = document.createElement("div");
      card.className = "item";
      card.id = "item-" + n;
      card.innerHTML = '<div class="idx">menu[' + n + ']</div><div class="emoji">' + item.emoji +
        '</div><div class="name">' + item.name + '</div><div class="price">' + item.price + "</div>";
      el("menu").appendChild(card);
    });

    let step = 0;

    function show() {
      const s = steps[step];

      el("code").innerHTML = "";
      s.code.forEach(function (text, n) {
        const line = document.createElement("div");
        line.className = "line" + (n === s.line ? (s.bug ? " bug" : " on") : "");
        line.textContent = text || " ";
        el("code").appendChild(line);
      });

      menu.forEach(function (item, n) {
        const card = el("item-" + n);
        card.classList.toggle("current", s.at === n);
        card.classList.toggle("done", s.at !== undefined && (n < s.at || (s.allDone && n !== s.at)));
      });

      const pointer = el("pointer");
      if (s.at === undefined) {
        pointer.textContent = "";
      } else {
        pointer.textContent = s.stop ? "i = 4: stop!" : "↑ i = " + s.at;
        pointer.style.left = ((Math.min(s.at, 3) * 2 + 1) / 8 * 100 + (s.at > 3 ? 12 : 0)) + "%";
      }
      pointer.classList.toggle("stop", !!s.stop);

      el("v-i").textContent = s.i || "–";
      el("m-i").textContent = s.iMath || "";
      el("v-total").textContent = s.total || "–";
      el("m-total").textContent = s.tMath || "";
      el("box-total").classList.toggle("pop", !!s.pop);
      el("box-total").classList.toggle("bug", !!s.bugBox);

      el("caption").innerHTML = s.text;
      el("count").textContent = (step + 1) + " / " + steps.length;
      el("back").disabled = step === 0;
      el("next").disabled = step === steps.length - 1;
    }

    el("next").addEventListener("click", function () { if (step < steps.length - 1) { step++; show(); } });
    el("back").addEventListener("click", function () { if (step > 0) { step--; show(); } });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") el("next").click();
      if (e.key === "ArrowLeft") el("back").click();
    });

    show();
  </script>
</body>
</html>
